<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нормативы по бегу</title>
    <link rel="icon" type="image/svg+xml" href="trophy.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="container py-4">
            <h1 class="display-5 fw-bold mb-1 text-center">Нормативы по бегу</h1>
            <p class="text-secondary mb-0 text-center">Минимализм • Скорость • Точность</p>
        </div>
    </header>
    <div class="container py-4">
        
        <form id="searchForm" class="mx-auto" style="max-width: 800px; width: 100%;">
            <div class="mb-3">
                <label for="gender" class="form-label">Пол</label>
                <select class="form-select select-gender" id="gender" required>
                    <option value="">Выберите...</option>
                    <option value="woman">Женщины</option>
                    <option value="man">Мужчины</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="location" class="form-label">Место</label>
                <select class="form-select select-location" id="location" disabled>
                    <option value="">Выберите...</option>
                    <option value="stadium">Стадион</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="distance" class="form-label">Дистанция</label>
                <select class="form-select select-distance" id="distance" disabled>
                    <option value="">Выберите...</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="measurement" class="form-label">Хронометраж</label>
                <select class="form-select select-measurement" id="measurement" disabled>
                    <option value="">Выберите...</option>
                    <option value="ручной">Ручной</option>
                    <option value="авто">Авто</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="circle" class="form-label">Размер круга (опционально)</label>
                <select class="form-select select-circle" id="circle" disabled>
                    <option value="">Все</option>
                </select>
            </div>
        </form>
        
        <div id="results" class="mt-4">
            <div class="alert alert-secondary text-center" id="placeholder">
                Выберите параметры для поиска нормативов
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
